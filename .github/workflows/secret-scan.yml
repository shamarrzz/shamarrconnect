name: Secret scan

# Backstop for the local pre-commit hook: scans every push and PR so a
# bypassed/unconfigured hook (commit --no-verify, fresh clone) still can't
# land a secret on the public repo. Uses the gitleaks binary directly —
# gitleaks-action needs a (paid) license key for org repos.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact .
