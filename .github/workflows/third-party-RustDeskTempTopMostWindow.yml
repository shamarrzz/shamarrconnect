name: build RustDeskTempTopMostWindow

on:
  workflow_call:
    inputs:
        upload-artifact:
          type: boolean
          default: true
        target:
            description: 'Target'
            required: true
            type: string
            default: 'windows-2022'
        configuration:
            description: 'Configuration'
            required: true
            type: string
            default: 'Release'
        platform:
            description: 'Platform'
            required: true
            type: string
            default: 'x64'
        target_version:
            description: 'TargetVersion'
            required: true
            type: string
            default: 'Windows10'

env:
  project_path: WindowInjection/WindowInjection.vcxproj

jobs:
  build-RustDeskTempTopMostWindow:
    runs-on: ${{ inputs.target }}
    strategy:
        fail-fast: false
    env:
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/${{ inputs.platform }}/${{ inputs.configuration }}
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Download the source code
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

        # Build. commit 53b548a5398624f7149a382000397993542ad796 is tag v0.3
      - name: Build the project
        run: |
          cd RustDeskTempTopMostWindow && git checkout 53b548a5398624f7149a382000397993542ad796
          python -c '
          p = "WindowInjection/dllmain.cpp"
          s = open(p, "r", encoding="utf-8", errors="ignore").read()
          s = s.replace("RustDeskPrivacyWindow", "ShamarrConnectPrivacyWindow")
          old_band = "if (!hwnd)\n\t{\n\t\tShowErrorMsg(_T(\"CreateWindowInBand\"));\n\t\treturn nullptr;\n\t}"
          new_band = "if (!hwnd && zbid != ZBID_DESKTOP)\n\t{\n\t\thwnd = pCreateWindowInBand(WS_EX_TOPMOST | WS_EX_NOACTIVATE, res, NULL, 0x80000000, 0, 0, 0, 0, NULL, NULL, wndParentClass.hInstance, LPVOID(res), ZBID_DESKTOP);\n\t}\n\tif (!hwnd)\n\t{\n\t\thwnd = CreateWindowEx(WS_EX_TOPMOST | WS_EX_NOACTIVATE, classname, title, 0x80000000, 0, 0, 0, 0, NULL, NULL, wndParentClass.hInstance, NULL);\n\t}\n\tif (!hwnd)\n\t{\n\t\treturn nullptr;\n\t}"
          s = s.replace(old_band.replace("\n", "\r\n"), new_band.replace("\n", "\r\n")).replace(old_band, new_band)
          open(p, "w", encoding="utf-8").write(s)
          '
          msbuild ${{ env.project_path }} -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.platform }} /p:TargetVersion=${{ inputs.target_version }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.upload-artifact }}
        with:
            name: topmostwindow-artifacts
            path: |
              ./${{ env.build_output_dir }}/WindowInjection.dll
