<script>
(function(){
  try{
    if(localStorage.getItem('sc-landing-theme')!=='light') document.documentElement.classList.add('dark');
    if(sessionStorage.getItem('sc_token')) document.documentElement.classList.add('in');
  }catch(e){ document.documentElement.classList.add('dark'); }
})();
</script>

  <nav class="side-nav" aria-label="Account">
    <a class="side-link" href="/account#desk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>

      <span>Security</span>
    </a>
    <a class="side-link" href="/account/team/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.2" r="2.5"/><circle cx="16.2" cy="9" r="2"/><path d="M4.2 18.6c.9-2.5 2.8-3.7 4.8-3.7s3.9 1.2 4.8 3.7M14.2 14.8c1.4-.2 2.8.5 3.6 2.2"/></svg>

</aside>
<div class="workspace">
<header class="topbar">
  <a class="top-mark" href="/account#desk" aria-label="Desk"><img src="/logo-mark.svg" width="32" height="32" alt=""></a>
  <div class="top-end">
    <button type="button" class="theme-switch" id="theme-switch" aria-pressed="true">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="theme-label">Dark</span>
    </button>
  </div>
</header>
<main>
  <h1>Join a team</h1>
  <p class="sub" id="sub">Checking invite…</p>
  <div class="card narrow" id="card">
    <div class="oauth" id="oauth" hidden>
      <a class="oauth-btn" id="btn-google" href="https://api.shamarrconnect.com/api/oauth/google/start" aria-label="Sign in with Google">
        <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.1 26.8 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.6 7.1l6.3 5.3C37.4 38.4 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/>
        </svg>
      </a>
      <a class="oauth-btn li" id="btn-linkedin" href="https://api.shamarrconnect.com/api/oauth/linkedin/start" aria-label="Sign in with LinkedIn">
        <span class="in-mark" aria-hidden="true">in</span>
      </a>
    </div>
    <div id="body"><p class="empty">Loading…</p></div>
    <div class="msg" id="msg"></div>
  </div>
  <p class="note">Sign in with the invited email.</p>
</main>
<footer>ShamarrConnect · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
</div>
</div>
<script>
(function(){
  var API = "https://api.shamarrconnect.com";
  var params = new URLSearchParams(location.search);
  var tokenInvite = params.get("token") || "";
  var $ = function(id){ return document.getElementById(id); };

  function sessionToken(){ return sessionStorage.getItem("sc_token"); }
  function setSession(t){ t ? sessionStorage.setItem("sc_token", t) : sessionStorage.removeItem("sc_token"); }
  function esc(s){
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  }
  function showErr(m){ $("msg").textContent = m; $("msg").className = "msg err"; }
  function showOk(m){ $("msg").textContent = m; $("msg").className = "msg ok"; }

  (function theme(){
    var themeBtn = $("theme-switch");
    function setTheme(dark){
      document.documentElement.classList.toggle("dark", dark);
      if (themeBtn){
        themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
        var lab = themeBtn.querySelector(".theme-label");
        if (lab) lab.textContent = dark ? "Dark" : "Light";
      }
      try{ localStorage.setItem("sc-landing-theme", dark ? "dark" : "light"); }catch(e){}
    }
    if (themeBtn){
      setTheme(document.documentElement.classList.contains("dark"));
      themeBtn.addEventListener("click", function(){
        setTheme(!document.documentElement.classList.contains("dark"));
      });
    }
  })();

  (function takeOauth(){
    var hash = location.hash || "";
    if (hash.indexOf("#token=") === 0) {
      var t = decodeURIComponent(hash.slice("#token=".length));
      if (t) setSession(t);
      history.replaceState(null, "", location.pathname + location.search);
    }
    var q = new URLSearchParams(location.search);
    var err = q.get("oauth_error");
    if (err) {
      q.delete("oauth_error");
      var qs = q.toString();
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
      showErr(err);
    }
  })();

  if (!tokenInvite){
    $("sub").textContent = "This invite link is missing a token.";
    $("body").innerHTML = "<p>Ask your admin to send a new invite.</p>";
    return;
  }

  var next = location.pathname + location.search;
  var oauthBase = "https://api.shamarrconnect.com/api/oauth/";
  $("btn-google").href = oauthBase + "google/start?next=" + encodeURIComponent(next);
  $("btn-linkedin").href = oauthBase + "linkedin/start?next=" + encodeURIComponent(next);

  fetch(API + "/api/org/invites/peek?token=" + encodeURIComponent(tokenInvite))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.valid){
        $("sub").textContent = "This invite is invalid or expired.";
        $("body").innerHTML = "<p>Ask your team admin for a new invite link.</p>";
        return;
      }
      $("sub").textContent = "You're invited to join " + j.org_name + " as " + j.role + ".";
      renderForm(j);
    })
    .catch(function(){
      $("sub").textContent = "Could not reach the server.";
      $("body").innerHTML = "<p>Try again in a moment.</p>";
    });

  function renderForm(inv){
    $("oauth").hidden = false;
    $("body").innerHTML =
      "<p class='or'>Sign in with <strong>"+esc(inv.email)+"</strong>.</p>"+
      "<form id='f'>"+
      "<label>Email</label><input id='email' type='email' value='"+esc(inv.email)+"' required>"+
      "<label>Password</label><input id='password' type='password' autocomplete='current-password' required>"+
      "<div id='mfa-row' hidden><label>Two-step code</label><input id='code' inputmode='numeric'></div>"+
      "<button class='btn block' id='btn' type='submit'>Sign in and join</button>"+
      "</form>";

    var mfaSecret = null;
    $("f").addEventListener("submit", function(ev){
      ev.preventDefault();
      var email = $("email").value.trim(), pw = $("password").value;
      var body = mfaSecret
        ? { username: email, type: "tfa_code", tfaCode: $("code").value.trim(), verificationCode: $("code").value.trim(), secret: mfaSecret }
        : { username: email, password: pw, type: "account" };
      var btn = $("btn"); btn.disabled = true;
      fetch(API + "/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) })
        .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
        .then(function(res){
          if (res.ok && res.j.access_token){
            setSession(res.j.access_token);
            return accept();
          }
          if (res.j.tfa_type === "tfa_check" && res.j.secret){
            mfaSecret = res.j.secret;
            $("mfa-row").hidden = false;
            $("code").focus();
            return;
          }
          throw new Error(res.j.error || "Sign in failed");
        })
        .catch(function(e){ showErr(e.message); })
        .finally(function(){ btn.disabled = false; });
    });

    if (sessionToken()){
      accept().catch(function(){});
    }
  }

  function accept(){
    return fetch(API + "/api/org/invites/accept", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + sessionToken()
      },
      body: JSON.stringify({ token: tokenInvite })
    }).then(function(r){
      return r.json().then(function(j){
        if (!r.ok) throw new Error(j.error || "Could not accept invite");
        showOk("You're on the team. Redirecting…");
        setTimeout(function(){ location.href = "/account/team/"; }, 800);
      });
    }).catch(function(e){
      if (e.message) showErr(e.message);
      throw e;
    });
  }
})();
</script>
</body>
</html>
