allprojects {
    repositories {
        google()
        jcenter()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// AGP 8 requires a namespace. Flutter 3.24 plugins still declare it only
// as the manifest package attribute.
subprojects { sub ->
    sub.afterEvaluate {
        def isAndroid = sub.plugins.hasPlugin("com.android.library") || sub.plugins.hasPlugin("com.android.application")
        if (!isAndroid || sub.android.namespace != null) {
            return
        }
        def manifestFile = sub.android.sourceSets.main.manifest.srcFile
        if (manifestFile == null || !manifestFile.exists()) {
            return
        }
        def pkg = new XmlParser().parse(manifestFile).attribute("package")
        if (pkg) {
            sub.android.namespace = pkg.toString()
        }
    }
}
// AGP 8 rejects a module whose Java target is 8 and Kotlin target is 17.
subprojects { sub ->
    sub.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }
    sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
